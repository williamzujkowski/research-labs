name: Retry simulation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: ./scripts/retry-lab.sh test
      - name: Fixed matrix including controls
        run: |
          mkdir -p results/retry
          ./scripts/retry-lab.sh run > results/retry/observations.json
          python3 labs/retry-recovery/export.py results/retry/observations.json results/retry/csv
      - name: Retain all observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retry-observations
          path: results/retry/
          if-no-files-found: ignore
